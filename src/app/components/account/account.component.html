<app-breadcrumb [breadcrumb]="breadcrumb" *ngIf="showSidebar"></app-breadcrumb>
<section class="user-dashboard-section section-b-space p-0" [class.bank-details-full-width]="!showSidebar"
    [class.orders-full-width]="!showSidebar" [class.order-details-full-width]="!showSidebar"
    [class.addresses-full-width]="!showSidebar" [class.dashboard-full-width]="!showSidebar">
    <div class="container-fluid">
        <div class="row">
            <div class="col-xxl-3 col-lg-4" *ngIf="showSidebar">
                <div class="dashboard-left-sidebar" [class.show]="open">
                    <app-sidebar [show]="open" (menu)="openMenu($event)"></app-sidebar>
                </div>
            </div>
            <div [class]="showSidebar ? 'col-xxl-9 col-lg-8' : 'col-12'" id="account">
                <ng-container>
                    <app-button [class]="'btn left-dashboard-show btn-animation btn-md fw-bold d-block mb-4 d-lg-none'"
                        [type]="'button'" [id]="'show_menu'" (click)="openMenu(true)" [spinner]="false"
                        *ngIf="showSidebar">
                        {{ 'show_menu' | translate }}
                    </app-button>
                    <div class="dashboard-right-sidebar">
                        <div class="tab-content">
                            <router-outlet></router-outlet>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</section>
